[project]
name = "geomidia-backend"
version = "1.0.0"
description = "API FastAPI para o sistema GeoMidia"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "SQLAlchemy==2.0.41",
    "greenlet==3.5.3",
    "asyncpg==0.30.0",
    "geoalchemy2==0.17.1",
    "pydantic-settings==2.10.1",
    "email-validator==2.2.0",
    "PyJWT==2.10.1",
    "pwdlib[argon2]==0.2.1",
    "alembic==1.16.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.vercel]
entrypoint = "app.main:app"
